[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

# Shared — safe for both targets
[dependencies]
axum = { version = "0.8", default-features = false, features = ["json", "http1"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-service = "0.3"

# WASM
[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = { version = "0.8", features = ["http", "axum"] }
worker-macros = { version = "0.8", features = ["http"] }

# Native — add axum/tokio + real tokio
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { version = "0.8", default-features = false, features = ["json", "http1", "tokio"] }
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "net", "signal"] }