name: Deploy Crockis

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Cloudflare Workers
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          check-latest: true
          cache: npm
          cache-dependency-path: crockis/web/package-lock.json

      - name: Install dependencies
        working-directory: crockis/web
        run: npm ci

      - name: Build frontend
        working-directory: crockis/web
        run: npm run build

      - name: Deploy to production
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        id: deploy-production
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: crockis

      - name: Deploy preview
        if: github.event_name == 'pull_request'
        id: deploy-preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: crockis
          command: versions upload --preview-alias pr-${{ github.event.pull_request.number }} --message "Preview for PR #${{ github.event.pull_request.number }}"
