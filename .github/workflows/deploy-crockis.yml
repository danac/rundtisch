name: Deploy Crockis

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Cloudflare Workers
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          check-latest: true
          cache: npm
          cache-dependency-path: crockis/web/package-lock.json

      - name: Install dependencies
        working-directory: crockis/web
        run: npm ci

      - name: Build frontend
        working-directory: crockis/web
        run: npm run build

      - name: Deploy to production
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: crockis
