[general]
root = "/public"
page404 = "/public/index.html"
# Turn off the 1-day default so HTML/SPA routes are not sticky after a deploy.
cache-control-headers = false
directory-listing = false
log-level = "error"

[advanced]
# Request URI globs. Later entries override earlier ones for the same header.
[[advanced.headers]]
source = "**"
[advanced.headers.headers]
Cache-Control = "no-cache"

[[advanced.headers]]
source = "/assets/**"
[advanced.headers.headers]
Cache-Control = "public, max-age=31536000, immutable"
