[package]
name = "crockis"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
rundtisch = { path = "../../crates/rundtisch", features = ["auth", "smtp"] }
axum = { workspace = true, features = ["json", "http1", "tokio"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal", "fs", "process", "time"] }
sea-orm = { workspace = true, features = ["sqlx-mysql", "runtime-tokio-rustls", "with-time"] }
sea-orm-migration = { workspace = true, features = ["sqlx-mysql", "runtime-tokio-rustls", "with-time"] }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
time = { workspace = true, features = ["formatting", "macros", "std"] }
tower-http = { workspace = true, features = ["fs"] }
dotenvy.workspace = true
uuid = { version = "1", default-features = false, features = ["v4"] }
imagesize = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
async-trait = "0.1"
sea-orm = { workspace = true, features = ["sqlx-sqlite", "runtime-tokio-rustls", "with-time"] }
sea-orm-migration = { workspace = true, features = ["sqlx-sqlite", "runtime-tokio-rustls", "with-time"] }

[[bin]]
name = "crockis-native"
path = "src/bin/native.rs"

[[bin]]
name = "crockis-migrate"
path = "src/bin/migrate.rs"

[[bin]]
name = "crockis-auth-link"
path = "src/bin/auth_link.rs"
