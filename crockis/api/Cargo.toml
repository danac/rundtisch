[package]
name = "crockis"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
rundtisch = { path = "../../crates/rundtisch", features = ["auth", "smtp"] }
axum = { workspace = true, features = ["json", "http1", "tokio"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal", "fs", "process", "time"] }
sea-orm = { workspace = true, features = ["sqlx-mysql", "runtime-tokio-rustls"] }
sea-orm-migration = { workspace = true, features = ["sqlx-mysql", "runtime-tokio-rustls"] }
serde_json.workspace = true
time.workspace = true
tower-http = { workspace = true, features = ["fs"] }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }

[[bin]]
name = "crockis-native"
path = "src/bin/native.rs"

[[bin]]
name = "crockis-migrate"
path = "src/bin/migrate.rs"

[[bin]]
name = "crockis-auth-link"
path = "src/bin/auth_link.rs"
