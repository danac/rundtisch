kind: wasmer.io/App.v0
name: crockis
package: .
# Set this to your Wasmer account or namespace, or pass --owner to `wasmer deploy`.
# owner: YOUR_WASMER_USERNAME
debug: false
volumes:
  - name: data
    mount: /app/data
# HealthCheckV1 is an externally tagged serde enum. serde_yaml 0.9 expects a
# YAML tag (`!http`), not a map (`http:`). Nested `expect` matches HttpRequest.
health_checks:
  - !http
    method: GET
    path: /
    interval: 30s
    timeout: 10s
    unhealthy_threshold: 2
    healthy_threshold: 1
    expect:
      status_codes:
        - 200
