kind: wasmer.io/App.v0
name: crockis-photos
package: .
# Set this to your Wasmer account or namespace, or let `wasmer deploy` prompt.
# owner: YOUR_WASMER_USERNAME
#
# Auth secrets are not committed here. Set them on the app (dashboard or
# `wasmer app secret`). The commented "Ensure auth secrets" step in
# `.github/workflows/deploy-crockis.yml` can create missing ones:
#   AUTH_HASH_PEPPER
# SMTP STARTTLS for recovery mail (SmtpEmailSender):
#   AUTH_SMTP_URL
#   AUTH_SMTP_USERNAME
#   AUTH_SMTP_PASSWORD
#   AUTH_MAIL_FROM   # optional; default rundtisch@localhost
# Optional first admin. The post-deployment migrate job upserts this email:
# insert a verified Admin if absent, or reset the password if present
# (public_id and the rest of the row stay the same):
#   RUNDTISCH_BOOTSTRAP_ADMIN_EMAIL
#   RUNDTISCH_BOOTSTRAP_ADMIN_PASSWORD
#   RUNDTISCH_BOOTSTRAP_ADMIN_ALIAS   # optional; insert only; defaults to the email local-part
# WebAuthn RP settings (app secrets, not committed here):
#   AUTH_WEBAUTHN_RP_ID
#   AUTH_WEBAUTHN_RP_ORIGIN
#   AUTH_WEBAUTHN_RP_NAME
# Local Vite on port 5174 sets these in the dev script.
debug: false
capabilities:
  database:
    engine: mysql
# Managed MySQL is only offered in some regions. Apps with a database must
# name exactly one of those regions.
locality:
  regions:
    - fr-roub1
# Persistent image files. The name must stay `data`: renaming or removing
# this entry on a later deploy deletes the volume. There is no separate
# create command — `wasmer deploy` creates it and mounts it at /data for the
# app and for execute jobs (including migrate). danac/crockis-photos has no
# volume until that deploy. SSH sessions see the same mount, so the manual
# `seed` command writes picture files under /data.
volumes:
  - name: data
    mount: /data
# Run the package `migrate` command once after each new version is created.
# The job gets the app's DB_* env, secrets, and the /data volume. SeaORM
# applies pending auth and library migrations, then upserts a bootstrap Admin
# when RUNDTISCH_BOOTSTRAP_ADMIN_EMAIL and RUNDTISCH_BOOTSTRAP_ADMIN_PASSWORD
# are set. It does not download pictures. Load the catalog by SSHing in and
# running the package command `seed` (DATA_DIR defaults to /data). Do not call
# migrate or seed from native startup or HTTP handlers.
jobs:
  - name: migrate-database
    trigger: post-deployment
    timeout: 5m
    retries: 2
    action:
      execute:
        command: migrate
# HealthCheckV1 is an externally tagged serde enum. serde_yaml 0.9 expects a
# YAML tag (`!http`), not a map (`http:`). Nested `expect` matches HttpRequest.
health_checks:
  - !http
    method: GET
    path: /api/health
    interval: 30s
    timeout: 10s
    unhealthy_threshold: 2
    healthy_threshold: 1
    expect:
      status_codes:
        - 200
