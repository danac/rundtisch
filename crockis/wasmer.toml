[package]
name = "crockis"
version = "0.1.0"
description = "Crockis photo library: static React SPA on Wasmer Edge"
license = "MIT"
readme = "./README.md"
repository = "https://github.com/danac/rundtisch"
entrypoint = "script"

[dependencies]
"wasmer/static-web-server" = "^1"

# Guest path /public is what static-web-server serves as the website root.
# Build the frontend first: `npm run build --prefix crockis/web`.
[fs]
"/public" = "./web/dist"
"/settings" = "./settings"

[[command]]
name = "script"
module = "wasmer/static-web-server:webserver"
runner = "wasi"

[command.annotations.wasi]
# --config-file (not -w) is the flag this 1.x build accepts.
# Cache and SPA 404 fallback live in settings/config.toml.
main-args = ["--config-file", "/settings/config.toml"]
