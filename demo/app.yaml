kind: wasmer.io/App.v0
name: rundtisch
package: .
# Set this to your Wasmer account or namespace, or let `wasmer deploy` prompt.
# owner: YOUR_WASMER_USERNAME
#
# Auth secrets are not committed here. Set them on the app (dashboard or
# `wasmer app secret`). The commented "Ensure auth secrets" step in
# `.github/workflows/ci.yml` can create missing ones:
#   AUTH_JWT_ACCESS_SECRET
#   AUTH_JWT_VERIFY_SECRET
#   AUTH_HASH_PEPPER
debug: false
capabilities:
  database:
    engine: mysql
# Managed MySQL is only offered in some regions. Apps with a database must
# name exactly one of those regions.
locality:
  regions:
    - fr-roub1
# Run the package `migrate` command once per deploy, before the new version
# is created. The job gets the app's DB_* env. SeaORM applies pending
# migrations only. Do not call migrate from native startup or HTTP handlers.
jobs:
  - name: migrate-database
    trigger: pre-deployment
    timeout: 5m
    retries: 2
    action:
      execute:
        command: migrate
# HealthCheckV1 is an externally tagged serde enum. serde_yaml 0.9 expects a
# YAML tag (`!http`), not a map (`http:`). Nested `expect` matches HttpRequest.
health_checks:
  - !http
    method: GET
    path: /api/health
    interval: 30s
    timeout: 10s
    unhealthy_threshold: 2
    healthy_threshold: 1
    expect:
      status_codes:
        - 200
