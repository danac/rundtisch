[package]
name = "rundtisch-demo"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
rundtisch = { path = "../../crates/rundtisch" }
axum = { workspace = true, features = ["json", "http1", "tokio"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal"] }
sea-orm = { workspace = true, features = ["sqlx-mysql"] }
sea-orm-migration.workspace = true
serde_json.workspace = true

[[bin]]
name = "native"
path = "src/bin/native.rs"

[[bin]]
name = "migrate"
path = "src/bin/migrate.rs"
