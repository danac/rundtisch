[package]
name = "rundtisch-demo"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
rundtisch = { path = "../../crates/rundtisch" }
axum = { workspace = true, features = ["json", "http1", "tokio"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal"] }
sea-orm = { workspace = true, features = ["sqlx-mysql", "runtime-tokio-rustls"] }
sea-orm-migration = { workspace = true, features = ["sqlx-mysql", "runtime-tokio-rustls"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
email_address = { workspace = true, features = ["serde"] }
time = { workspace = true, features = ["parsing"] }
uuid.workspace = true
zeroize = { workspace = true, features = ["alloc"] }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
sea-orm = { workspace = true, features = ["sqlx-sqlite", "runtime-tokio-rustls"] }

[[bin]]
name = "native"
path = "src/bin/native.rs"

[[bin]]
name = "migrate"
path = "src/bin/migrate.rs"
