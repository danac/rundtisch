[package]
name = "rundtisch-demo"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
rundtisch = { path = "../../crates/rundtisch", features = ["auth", "sendmail"] }
axum = { workspace = true, features = ["json", "http1", "tokio"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal", "fs", "process", "time"] }
sea-orm = { workspace = true, features = ["sqlx-mysql", "runtime-tokio-rustls"] }
sea-orm-migration = { workspace = true, features = ["sqlx-mysql", "runtime-tokio-rustls"] }
serde_json.workspace = true
time.workspace = true
tower-http = { workspace = true, features = ["fs"] }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }

[[bin]]
name = "native"
path = "src/bin/native.rs"

[[bin]]
name = "migrate"
path = "src/bin/migrate.rs"

[[bin]]
name = "sendmail_rs"
path = "src/bin/sendmail_rs.rs"

[[bin]]
name = "auth-link"
path = "src/bin/auth_link.rs"
