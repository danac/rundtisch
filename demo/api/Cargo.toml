[package]
name = "rundtisch-demo"
version.workspace = true
edition.workspace = true
publish = false

[features]
default = ["native"]
native = ["rundtisch/sqlite", "dep:tokio", "axum/http1", "axum/tokio"]
cloudflare = ["rundtisch/d1"]

[dependencies]
rundtisch = { path = "../../crates/rundtisch", default-features = false }
serde_json.workspace = true
axum = { workspace = true, features = ["json"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal"], optional = true }

[[bin]]
name = "native"
path = "src/bin/native.rs"
required-features = ["native"]

[[bin]]
name = "generate_auth_migrations"
path = "src/bin/generate_auth_migrations.rs"
