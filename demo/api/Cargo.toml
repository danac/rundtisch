[package]
name = "rundtisch-demo"
version.workspace = true
edition.workspace = true
publish = false

[features]
default = []

[dependencies]
rundtisch = { path = "../../crates/rundtisch", default-features = false }
serde_json = "1.0"
axum = { version = "0.8", default-features = false, features = ["tokio", "json", "http1"]}
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "net", "signal"] }

[[bin]]
name = "native"
path = "src/bin/native.rs"

[[bin]]
name = "generate_auth_migrations"
path = "src/bin/generate_auth_migrations.rs"
