[package]
name = "rundtisch-demo-worker"
version.workspace = true
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
rundtisch = { path = "../../crates/rundtisch", default-features = false }
rundtisch-demo = { path = "../api", default-features = false, features = ["cloudflare"]}
tower-service = "0.3"
axum = { version = "0.8", default-features = false}
worker-macros = { version = "0.8", features = ["http"] }
worker = { version = "0.8.5", features = ["http"] }

