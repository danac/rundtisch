[package]
name = "rundtisch"
version.workspace = true
edition.workspace = true
description = "Thin platform-agnostic layer for Axum apps on Cloudflare Workers and native containers"
repository = "https://github.com/danac/rundtisch"
readme = "README.md"
publish = false

[features]
default = []
native = ["dep:sqlx"]
cloudflare = ["dep:worker"]

[dependencies]
email_address.workspace = true
sea-query.workspace = true
sqlx = { workspace = true, optional = true }
time.workspace = true
worker = { workspace = true, optional = true }

[dev-dependencies]
tokio.workspace = true
