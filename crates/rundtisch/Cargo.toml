[package]
name = "rundtisch"
version.workspace = true
edition.workspace = true
description = "Thin platform-agnostic layer for Axum apps on Cloudflare Workers and native containers"
repository = "https://github.com/danac/rundtisch"
readme = "README.md"
publish = false

[dependencies]
email_address = "0.2.9"
sea-query = "1.0.1"
sqlx = { version = "0.9.0", features = ["sqlite"] }
time = { version = "0.3.53", default-features = false, features = ["formatting", "parsing"] }
worker = { version = "0.8", features = ["http", "axum", "d1"] }
[dev-dependencies]
tokio = { version= "1.52.3", features=["macros", "rt"] }
