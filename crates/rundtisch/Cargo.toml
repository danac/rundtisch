[package]
name = "rundtisch"
version.workspace = true
edition.workspace = true
description = "Axum auth helpers on SeaORM"
repository = "https://github.com/danac/rundtisch"
readme = "README.md"
publish = false

[dependencies]
sea-orm = { workspace = true, features = [
    "macros",
    "runtime-tokio-rustls",
    "with-time",
    "with-uuid",
#    "sqlx-sqlite",
    "sqlx-mysql",
    "sqlx-postgres",
] }
sea-orm-migration = { workspace = true, features = [
    "runtime-tokio-rustls",
#    "sqlx-sqlite",
    "sqlx-mysql",
    "sqlx-postgres",
] }
serde = { workspace = true, features = ["derive", "alloc"] }
email_address = { workspace = true, features = ["serde"] }
time = { workspace = true, features = ["std", "formatting", "parsing", "serde", "serde-well-known"] }
axum = { workspace = true, features = ["json"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
uuid = { workspace = true, features = ["std", "serde"] }
getrandom = { workspace = true, features = ["std"] }
jwt-compact = { workspace = true, features = ["std"] }
chrono = { workspace = true, features = ["alloc"] }
argon2 = { workspace = true, features = ["alloc", "password-hash", "zeroize"] }
hmac.workspace = true
sha2.workspace = true
subtle.workspace = true
base64 = { workspace = true, features = ["alloc"] }
zeroize = { workspace = true, features = ["alloc"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }
async-trait.workspace = true
