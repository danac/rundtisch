[package]
name = "rundtisch"
version.workspace = true
edition.workspace = true
description = "Axum auth helpers on SeaORM"
repository = "https://github.com/danac/rundtisch"
readme = "README.md"
publish = false

[dependencies]
sea-orm = { workspace = true, features = [
    "macros",
    "runtime-tokio-rustls",
    "with-time",
    "with-uuid",
    "sqlx-sqlite",
    "sqlx-mysql",
    "sqlx-postgres",
] }
sea-orm-migration = { workspace = true, features = [
    "runtime-tokio-rustls",
    "sqlx-sqlite",
    "sqlx-mysql",
    "sqlx-postgres",
] }
serde = { workspace = true, features = ["derive", "alloc"] }
email_address = { workspace = true, features = ["serde"] }
time = { workspace = true, features = ["std", "formatting", "parsing", "serde", "serde-well-known"] }
axum = { workspace = true, features = ["json"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
uuid = { version = "1.18", default-features = false, features = ["std", "serde"] }
getrandom = { version = "0.3.4", features = ["std"] }
jwt-compact = { version = "0.8", default-features = false, features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
argon2 = { version = "0.6", default-features = false, features = ["alloc", "password-hash", "zeroize"] }
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
zeroize = { version = "1", default-features = false, features = ["alloc"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
async-trait = "0.1"
