[package]
name = "rundtisch"
version.workspace = true
edition.workspace = true
description = "Axum auth helpers on SeaORM"
repository = "https://github.com/danac/rundtisch"
readme = "README.md"
publish = false

[dependencies]
sea-orm.workspace = true
sea-orm-migration.workspace = true
serde.workspace = true
email_address.workspace = true
time = { workspace = true, features = ["parsing"] }
axum = { workspace = true, features = ["json"] }
serde_json.workspace = true
uuid.workspace = true
getrandom.workspace = true
jwt-compact.workspace = true
chrono.workspace = true
argon2 = { workspace = true, features = ["alloc", "password-hash"] }
hmac.workspace = true
sha2.workspace = true
subtle.workspace = true
base64 = { workspace = true, features = ["alloc"] }
zeroize.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
tower = { workspace = true, features = ["util"] }
sea-orm = { workspace = true, features = ["sqlx-sqlite", "runtime-tokio-rustls"] }

