[package]
name = "rundtisch"
version.workspace = true
edition.workspace = true
description = "Axum auth helpers on SeaORM"
repository = "https://github.com/danac/rundtisch"
readme = "README.md"
publish = false

[features]
default = ["auth"]
auth = [
    "dep:sea-orm-migration",
    "dep:serde",
    "dep:email_address",
    "dep:time",
    "dep:axum",
    "dep:serde_json",
    "dep:uuid",
    "dep:getrandom",
    "dep:argon2",
    "dep:webauthn-rs",
    "dep:hmac",
    "dep:sha2",
    "dep:subtle",
    "dep:base64",
    "dep:zeroize",
]

[dependencies]
sea-orm.workspace = true
sea-orm-migration = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
email_address = { workspace = true, optional = true }
time = { workspace = true, features = ["parsing", "formatting", "serde"], optional = true }
axum = { workspace = true, features = ["json"], optional = true }
serde_json = { workspace = true, optional = true }
uuid = { workspace = true, features = ["serde"], optional = true }
getrandom = { workspace = true, optional = true }
argon2 = { workspace = true, features = ["alloc", "password-hash"], optional = true }
webauthn-rs = { version = "0.6.1-dev", features = ["danger-allow-state-serialisation"], optional = true }
hmac = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
subtle = { workspace = true, optional = true }
base64 = { workspace = true, features = ["alloc"], optional = true }
zeroize = { workspace = true, features = ["alloc"], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
tower = { workspace = true, features = ["util"] }
sea-orm = { workspace = true, features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
webauthn-authenticator-rs = { version = "0.6.1-dev", default-features = false, features = ["softpasskey"] }
