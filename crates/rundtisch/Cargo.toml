[package]
name = "rundtisch"
version.workspace = true
edition.workspace = true
description = "Thin platform-agnostic layer for Axum apps on Cloudflare Workers and native containers"
repository = "https://github.com/danac/rundtisch"
readme = "README.md"
publish = false

[features]
default = []
native = ["dep:tokio", "dep:axum", "axum/tokio", "dep:sqlx"]
cloudflare = ["dep:worker", "dep:tower-service", "dep:axum"]

[dependencies]
axum = { workspace = true, optional = true }
email_address.workspace = true
sea-query.workspace = true
serde.workspace = true
sqlx = { workspace = true, optional = true }
time.workspace = true
tokio = { workspace = true, optional = true }
tower-service = { workspace = true, optional = true }
worker = { workspace = true, optional = true }
