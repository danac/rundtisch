[package]
name = "rundtisch"
version = "0.1.0"
edition = "2024"
description = "Axum auth helpers on SeaORM"
repository = "https://github.com/danac/rundtisch"
readme = "README.md"
publish = false

[features]
default = ["auth"]
auth = [
    "dep:sea-orm-migration",
    "dep:serde",
    "dep:email_address",
    "dep:time",
    "dep:axum",
    "dep:serde_json",
    "dep:uuid",
    "dep:getrandom",
    "dep:argon2",
    "dep:webauthn-rs",
    "dep:hmac",
    "dep:sha2",
    "dep:subtle",
    "dep:base64",
    "dep:zeroize",
]

[dependencies]
sea-orm = { version = "2.0.3", default-features = false }
sea-orm-migration = { version = "2.0.3", default-features = false, optional = true }
serde = { version = "1.0.229", default-features = false, features = ["derive"], optional = true }
email_address = { version = "0.2.9", optional = true }
time = { version = "0.3.53", default-features = false, features = ["parsing", "formatting", "serde"], optional = true }
axum = { version = "0.8", default-features = false, features = ["json"], optional = true }
serde_json = { version = "1.0", optional = true }
uuid = { version = "1.18", default-features = false, features = ["serde"], optional = true }
getrandom = { version = "0.4.3", optional = true }
argon2 = { version = "0.6", default-features = false, features = ["alloc", "password-hash"], optional = true }
webauthn-rs = { version = "0.6.1-dev", features = ["danger-allow-state-serialisation"], optional = true }
hmac = { version = "0.13.0", optional = true }
sha2 = { version = "0.11.0", optional = true }
subtle = { version = "2", optional = true }
base64 = { version = "0.23.1", default-features = false, features = ["alloc"], optional = true }
zeroize = { version = "1", default-features = false, features = ["alloc"], optional = true }

[dev-dependencies]
tokio = { version = "1.47.0", default-features = false, features = ["macros", "rt"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
sea-orm = { version = "2.0.3", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
webauthn-authenticator-rs = { version = "0.6.1-dev", default-features = false, features = ["softpasskey"] }
