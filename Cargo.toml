[workspace]
resolver = "2"
members = [
    "crates/rundtisch",
    "demo/api",
    "demo/api/worker",
]
default-members = ["crates/rundtisch", "demo/api"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
axum = { version = "0.8", default-features = false, features = ["json", "http1"] }
email_address = "0.2.9"
sea-query = "1.0.1"
serde_json = "1.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite"] }
time = { version = "0.3.53", default-features = false, features = ["formatting", "parsing"] }
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-service = "0.3"
worker = { version = "0.8", features = ["http", "axum"] }
worker-macros = { version = "0.8", features = ["http"] }
