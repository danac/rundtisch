[workspace]
resolver = "2"
members = [
    "crates/rundtisch",
    "demo/api",
]
default-members = ["crates/rundtisch", "demo/api"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
sea-orm = { version = "2.0.3", default-features = false }
sea-orm-migration = { version = "2.0.3", default-features = false }
tokio = "1.53.1"
axum = { version = "0.8", default-features = false }
serde_json = "1.0"
serde = { version = "1.0.229", default-features = false }
time = { version = "0.3.53", default-features = false }
email_address = "0.2.9"
uuid = { version = "1.18", default-features = false }
getrandom = "0.3.4"
jwt-compact = { version = "0.8", default-features = false }
chrono = { version = "0.4", default-features = false }
argon2 = { version = "0.6", default-features = false }
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
base64 = { version = "0.22", default-features = false }
zeroize = { version = "1", default-features = false }
tower = { version = "0.5", default-features = false }
async-trait = "0.1"

