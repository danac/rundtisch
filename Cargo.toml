[workspace]
resolver = "2"
members = [
    "crates/rundtisch",
    "demo/api",
]
default-members = ["crates/rundtisch", "demo/api"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
sea-orm = { version = "2.0.3", default-features = false }
sea-orm-migration = { version = "2.0.3", default-features = false }
tokio = "1.53.1"
axum = { version = "0.8", default-features = false }
serde_json = "1.0"
serde = { version = "1.0.229", default-features = false }
time = { version = "0.3.53", default-features = false }
email_address = "0.2.9"

