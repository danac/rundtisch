[workspace]
resolver = "2"
members = [
    "crates/rundtisch",
    "demo/api",
    "demo/worker",
]
default-members = ["crates/rundtisch", "demo/api"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
sea-query = { version = "1.0.2", features = ["thread-safe"] }
sqlx = { version = "0.9.0", default-features = false }
worker = "0.8.6"
worker-macros = "0.8.6"
tokio = "1.53.1"
axum = { version = "0.8", default-features = false }
serde_json = "1.0"
tower-service = "0.3"
serde = { version = "1.0.229", default-features = false }
time = { version = "0.3.53", default-features = false }
email_address = "0.2.9"

