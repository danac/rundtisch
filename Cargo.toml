[workspace]
resolver = "2"
members = ["demo/api", "crockis/api"]
exclude = ["crates/rundtisch"]
default-members = ["demo/api"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
sea-orm = { version = "2.0.3", default-features = false }
sea-orm-migration = { version = "2.0.3", default-features = false }
tokio = { version = "1.47.0", default-features = false }
axum = { version = "0.8", default-features = false }
serde_json = "1.0"
time = { version = "0.3.53", default-features = false }
tower = { version = "0.5", default-features = false }
tower-http = { version = "0.6", default-features = false }
dotenvy = "0.15.7"